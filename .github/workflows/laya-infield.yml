name: Laya in-text judgements (4-2')

# Can the phone's Laya bundle fill empty signal fields from the description and
# judge situations (tools/laya/infield.py)? Report only: it never blocks the app build.

on:
  push:
    branches: [main]
    paths:
      - 'tools/laya/infield.py'
      - 'tools/laya/infield.json'
      - '.github/workflows/laya-infield.yml'
  workflow_dispatch:

jobs:
  infield:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MODEL: aac6fef/laya-multilingual-coreml-ane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .laya-cache
          key: laya-eval-${{ env.MODEL }}
      - name: Install laya-coreml
        run: pip install 'laya-coreml @ git+https://github.com/mizorewww/laya-coreml@4619e0483f07adf39068532e85b42ec2347edb83'
      - name: Check
        run: |
          set -o pipefail
          python tools/laya/infield.py --model "$MODEL" | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: infield
          path: infield-report.json
