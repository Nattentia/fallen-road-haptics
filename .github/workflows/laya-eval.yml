name: Evaluate Laya live questions (D5)

# Asks a Laya checkpoint the live questions about the validation states and
# reports, per question, whether its answers beat chance (tools/laya/evaluate.py).
# Report only: it never blocks the app build.

on:
  push:
    branches: [main]
    paths:
      - 'tools/laya/evaluate.py'
      - 'tools/laya/validation.json'
      - 'tools/laya/vocabulary.json'
      - 'tools/laya/rubric.json'
      - '.github/workflows/laya-eval.yml'
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face repo of a Core ML Laya checkpoint
        default: aac6fef/laya-multilingual-coreml-ane
      criteria:
        description: plain labels, or labels with example-object criteria (rubric.json)
        default: rubric

jobs:
  evaluate:
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        combo:
          - { questions: choice, state: full }
          - { questions: choice, state: desc }
          - { questions: choice, state: fields }
          - { questions: noul, state: full }
          - { questions: noul, state: desc }
          - { questions: noul, state: fields }
    env:
      MODEL: ${{ github.event.inputs.model || 'aac6fef/laya-multilingual-coreml-ane' }}
      CRITERIA: ${{ github.event.inputs.criteria || 'rubric' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .laya-cache
          key: laya-eval-${{ env.MODEL }}
      - name: Install laya-coreml
        run: pip install 'laya-coreml @ git+https://github.com/mizorewww/laya-coreml@4619e0483f07adf39068532e85b42ec2347edb83'
      - name: Evaluate
        run: |
          set -o pipefail
          python tools/laya/evaluate.py --model "$MODEL" --questions ${{ matrix.combo.questions }} --state ${{ matrix.combo.state }} --criteria "$CRITERIA" --out d5-report.json | tee d5-summary.md
          cat d5-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: d5-${{ matrix.combo.questions }}-${{ matrix.combo.state }}-${{ env.CRITERIA }}
          path: d5-report.json
