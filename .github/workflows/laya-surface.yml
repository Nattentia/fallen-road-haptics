name: Laya shield/body check

# Can the phone's Laya bundle tell whether a blow lands on a shield, a body or
# nothing (tools/laya/surface.py)? Report only: it never blocks the app build.

on:
  push:
    branches: [main]
    paths:
      - 'tools/laya/surface.py'
      - '.github/workflows/laya-surface.yml'
  workflow_dispatch:

jobs:
  surface:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        criteria: [plain, described]
    env:
      MODEL: aac6fef/laya-multilingual-coreml-ane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .laya-cache
          key: laya-eval-${{ env.MODEL }}
      - name: Install laya-coreml
        run: pip install 'laya-coreml @ git+https://github.com/mizorewww/laya-coreml@4619e0483f07adf39068532e85b42ec2347edb83'
      - name: Check
        run: |
          set -o pipefail
          python tools/laya/surface.py --model "$MODEL" --criteria ${{ matrix.criteria }} | tee summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-${{ matrix.criteria }}
          path: surface-report.json
