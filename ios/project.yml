# XcodeGen spec — the Xcode project is generated on the CI runner (no Mac needed locally).
name: FallenRoadHaptics
options:
  bundleIdPrefix: io.github.nattentia
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  FallenRoadHaptics:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # Built web game (npm run build → dist/client), copied in by CI.
      - path: App/web
        type: folder
        buildPhase: resources
      # Laya prompts, embeddings, golden outputs and compiled .mlmodelc, made by CI.
      - path: App/Laya
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FR Haptics
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nattentia.fallenroadhaptics
    # A shared scheme; once any target has one, Xcode stops making implicit ones.
    scheme: {}
  # Logic tests for the upscaler player, run on the simulator in CI. They
  # compile the tested sources directly (no host app, no Laya assets).
  FallenRoadHapticsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
        excludes:
          - Fixtures
      - path: AppTests/Fixtures
        type: folder
        buildPhase: resources
      - path: App/Sources/UpscalerContract.swift
      - path: App/Sources/UpscalerPlayer.swift
      - path: App/Sources/LayaLive.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nattentia.fallenroadhaptics.tests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - FallenRoadHapticsTests
